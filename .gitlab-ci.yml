stages:
  - build
  - test
  - deploy
  - post-deploy

include:
  - local: .gitlab/ci/e2e.yml

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store

.node_setup:
  image: node:24.15.0-trixie
  before_script:
    - corepack enable pnpm
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

.build_artifact:
  stage: build
  extends: .node_setup
  cache: []
  environment:
    action: prepare
  artifacts:
    when: on_success
    paths:
      - dist/
  before_script:
    - !reference [.node_setup, before_script]
    # The Doppler installer verifies its download with gpgv, which Debian 13 only
    # recommends from gnupg rather than depends on, so it is not installed by default.
    - apt update && apt install -y curl gnupg gpgv
    - curl -Ls --tlsv1.2 --proto "=https" --retry 3 https://cli.doppler.com/install.sh | sh
    - export VUE_APP_GOOGLE_RECAPTCHA_KEY="$GOOGLE_RECAPTCHA_KEY"
  script:
    - 'echo "{\"version\": \"$CI_COMMIT_SHA-$CI_ENVIRONMENT_NAME\"}" > public/version.json'
    - export VUE_APP_GOOGLE_RECAPTCHA_KEY="$GOOGLE_RECAPTCHA_KEY"
    - doppler run --token $DOPPLER_TOKEN -- pnpm run build

build_staging_artifact:
  extends: .build_artifact
  environment:
    name: staging
  variables:
    DOPPLER_TOKEN: $DOPPLER_TOKEN_STAGING
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' # MR is created or updated.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH # Committed to main.

build_production_artifact:
  extends: .build_artifact
  environment:
    name: production
  variables:
    DOPPLER_TOKEN: $DOPPLER_TOKEN_PRODUCTION
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH # Committed to main.

.deploy:
  stage: deploy
  image: registry.gitlab.com/static-web-apps/azure-static-web-apps-deploy
  variables:
    APP_PATH: '$CI_PROJECT_DIR/dist'
    SKIP_APP_BUILD: true
    SKIP_API_BUILD: true
  script:
    - echo "Deploying SWA."

deploy_staging:
  extends: .deploy
  environment:
    name: staging
  resource_group: staging
  variables:
    API_TOKEN: $AZURE_SWA_API_TOKEN_STAGING
  needs:
    - job: build_staging_artifact
      artifacts: true
    - job: test
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH # Committed to main.

deploy_production:
  extends: .deploy
  environment:
    name: production
  resource_group: production
  variables:
    API_TOKEN: $AZURE_SWA_API_TOKEN_PRODUCTION
  needs:
    - job: build_production_artifact
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH # Committed to main.
      when: manual

tag_commit_production:
  stage: post-deploy
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: deploy_production
  script:
    - echo 'Tag commit $CI_COMMIT_SHA'
  release:
    tag_name: 'deployed-$(date +%Y-%m-%d_%H-%M-%S)'
    description: 'Deployed from GitLab CI.'
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH # Committed to main.

new_relic_deploy_tracker:
  stage: post-deploy
  needs:
    - job: deploy_production
  variables:
    NEW_RELIC_DEPLOYMENT_USER_KEY: $NEW_RELIC_DEPLOYMENT_USER_KEY
    NEW_RELIC_BROWSER_GUID_PRODUCTION: $NEW_RELIC_BROWSER_GUID_PRODUCTION
  script: >
    curl -v https://api.newrelic.com/graphql
    -H 'content-type: application/json; charset=utf-8'
    -H "API-Key: $NEW_RELIC_DEPLOYMENT_USER_KEY"
    --data-raw '{"query":"mutation { changeTrackingCreateDeployment(deployment: {version: \"'$CI_COMMIT_SHA'\", entityGuid: \"'$NEW_RELIC_BROWSER_GUID_PRODUCTION'\"}) { deploymentId timestamp } }"}'
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH # Committed to main.

test:
  stage: test
  extends: .node_setup
  before_script:
    - !reference [.node_setup, before_script]
    - pnpm exec playwright install --with-deps chromium
  script:
    - pnpm run test
  rules:
    - if: '$TEST_DISABLED'
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' # MR is created or updated.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH # Committed to main.

e2e-test:
  extends: .e2e_base
  variables:
    HIGH_LINE_DIR: $CI_PROJECT_DIR
    SUBWAY_DIR: $CI_PROJECT_DIR/subway
  before_script:
    - git clone --depth=1 https://gitlab.com/upchieve/subway.git $SUBWAY_DIR
    - !reference [.e2e_base, before_script]
  rules:
    - if: '$TEST_DISABLED'
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' # MR is created or updated.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH # Committed to main.

lint:
  stage: test
  extends: .node_setup
  script:
    - pnpm run lint:dry
  rules:
    - if: '$TEST_DISABLED'
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' # MR is created or updated.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH # Committed to main.

html_validate:
  stage: test
  extends: .node_setup
  script:
    - pnpm run html-validate
  rules:
    - if: '$TEST_DISABLED'
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' # MR is created or updated.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH # Committed to main.
