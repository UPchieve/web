# vue@3.5.41 + @vue/test-utils@2.4.11 (both currently latest) break Vite's esbuild
# dep optimizer in vitest browser mode: `defineComponent` throws "isFunction is not
# a function" when a test file imports both `vue` and `vue-router`
# (related? https://github.com/rolldown/rolldown/issues/9502)
# Remove this override once a compatible pair ships upstream.
# This might be fixed with vite 8.
overrides:
  vue: '3.5.32'
  '@vue/test-utils': '2.4.6'

allowBuilds:
  '@fastify/pre-commit': true
  '@parcel/watcher': true
  core-js: true
  esbuild: true
  keytar: true
  protobufjs: true
  vue-demi: true

blockExoticSubdeps: true
minimumReleaseAge: 10080
trustPolicy: no-downgrade
trustPolicyExclude:
  # Released July 2023, required transitively by a number of vite related dependencies.
  - 'semver@6.3.1'
  # Released Aug 2025, required by amazon-chime-sdk-js.
  - 'ua-parser-js@1.0.41'
  # Released Nov 2024, required by transitive @types/node@20.19.39.
  - 'undici-types@6.21.0'
